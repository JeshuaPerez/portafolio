<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeshua Pérez · Desarrollador Backend</title>
  <meta name="description" content="Jeshua Pérez, desarrollador backend en Guatemala: APIs REST con Node.js y Express, bases de datos MongoDB y SQL, autenticación JWT. Proyectos con código abierto y CV descargable.">
  <meta name="theme-color" content="#15161a">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://jeshuaperez.github.io/portafolio/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jeshua Pérez · Portafolio">
  <meta property="og:title" content="Jeshua Pérez · Desarrollador Backend">
  <meta property="og:description" content="APIs REST con Node.js y Express, bases de datos y autenticación JWT. Proyectos con código abierto.">
  <meta property="og:url" content="https://jeshuaperez.github.io/portafolio/">
  <meta property="og:image" content="https://jeshuaperez.github.io/portafolio/assets/img/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Jeshua Pérez, desarrollador backend">
  <meta property="og:locale" content="es_GT">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jeshua Pérez · Desarrollador Backend">
  <meta name="twitter:description" content="APIs REST con Node.js y Express, bases de datos y autenticación JWT. Proyectos con código abierto.">
  <meta name="twitter:image" content="https://jeshuaperez.github.io/portafolio/assets/img/og-image.jpg">

  <script>
    // Se ejecuta antes de pintar la página para evitar parpadeos de tema.
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      root.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido" data-i18n="skip"></a>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="#inicio">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span id="brandName"></span>
    </a>

    <nav class="nav" id="nav" aria-label="Principal">
      <a href="#proyectos" data-i18n="nav.projects"></a>
      <a href="#sobre" data-i18n="nav.about"></a>
      <a href="#stack" data-i18n="nav.skills"></a>
      <a href="#servicios" data-i18n="nav.services"></a>
      <a href="#personal" data-i18n="nav.personal"></a>
      <a href="#contacto" data-i18n="nav.contact"></a>
    </nav>

    <div class="controls">
      <button class="pill" id="langToggle" type="button"></button>
      <button class="pill icon" id="themeToggle" type="button"></button>
      <button class="menu-btn" id="menuToggle" type="button" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu">☰</button>
    </div>
  </header>

  <main id="contenido">

    <!-- ===================== 1. INICIO ===================== -->
    <section class="section hero" id="inicio">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="hero-inner">
        <p class="eyebrow reveal" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-title reveal" style="--d:80ms">
          <span data-i18n="hero.greeting"></span>
          <span class="accent" id="heroName"></span>
        </h1>
        <p class="hero-role reveal" style="--d:160ms">
          <span class="prompt" aria-hidden="true">$</span>
          <span id="typewriter"></span><span class="caret" aria-hidden="true"></span>
        </p>
        <p class="hero-lead reveal" style="--d:240ms" data-i18n="hero.lead"></p>

        <div class="hero-actions reveal" style="--d:320ms">
          <a class="btn primary" id="heroCv" data-i18n="hero.cta1" download></a>
          <a class="btn ghost" href="#proyectos" data-i18n="hero.cta2"></a>
          <a class="btn link" id="heroGithub" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="btn link" id="heroLinkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>

        <ul class="hero-facts reveal" style="--d:380ms" id="heroFacts"></ul>

        <p class="availability reveal" style="--d:440ms">
          <span class="dot" aria-hidden="true"></span>
          <span data-i18n="hero.available"></span>
        </p>
      </div>
      <figure class="hero-card reveal" style="--d:200ms">
        <img id="heroPhoto" alt="" width="400" height="500">
        <figcaption>
          <strong id="heroCardName"></strong>
          <span id="heroCardRole"></span>
        </figcaption>
      </figure>
    </section>

    <!-- ===================== 2. PROYECTOS DESTACADOS ===================== -->
    <section class="section band" id="proyectos">
      <header class="section-head reveal">
        <p class="kicker" data-i18n="projects.kicker"></p>
        <h2 data-i18n="projects.title"></h2>
        <p class="lead" data-i18n="projects.lead"></p>
      </header>
      <div class="project-grid" id="projectGrid"></div>
      <p class="section-foot reveal">
        <a class="text-link" id="allRepos" target="_blank" rel="noopener noreferrer" data-i18n="projects.all"></a>
      </p>
    </section>

    <!-- ===================== 3. SOBRE MÍ ===================== -->
    <section class="section" id="sobre">
      <header class="section-head reveal">
        <p class="kicker" data-i18n="about.kicker"></p>
        <h2 data-i18n="about.title"></h2>
      </header>
      <div class="about-grid">
        <figure class="about-photo reveal">
          <img id="aboutPhoto" alt="" width="400" height="400" loading="lazy">
        </figure>
        <div class="about-text">
          <div id="bio" class="reveal"></div>
          <div class="stats" id="stats"></div>
        </div>
      </div>

      <h3 class="subhead reveal" data-i18n="about.diff"></h3>
      <div class="diff-grid" id="diffGrid"></div>
    </section>

    <!-- ===================== 4. HABILIDADES Y STACK ===================== -->
    <section class="section band" id="stack">
      <header class="section-head reveal">
        <p class="kicker" data-i18n="skills.kicker"></p>
        <h2 data-i18n="skills.title"></h2>
        <p class="lead" data-i18n="skills.lead"></p>
      </header>

      <div class="skill-grid" id="skillGrid"></div>

      <h3 class="subhead reveal" data-i18n="skills.practices"></h3>
      <ul class="practice-list" id="practiceList"></ul>

      <h3 class="subhead reveal" data-i18n="skills.tools"></h3>
      <div class="env-grid">
        <article class="neofetch reveal">
          <div class="window-bar">
            <span class="win-dot r" aria-hidden="true"></span>
            <span class="win-dot y" aria-hidden="true"></span>
            <span class="win-dot g" aria-hidden="true"></span>
            <span class="win-title">~/setup</span>
          </div>
          <div class="nf-body" id="neofetch"></div>
        </article>
        <div class="tool-grid" id="toolGrid"></div>
      </div>
    </section>

    <!-- ===================== 5. SERVICIOS ===================== -->
    <section class="section" id="servicios">
      <header class="section-head reveal">
        <p class="kicker" data-i18n="services.kicker"></p>
        <h2 data-i18n="services.title"></h2>
        <p class="lead" data-i18n="services.lead"></p>
      </header>
      <div class="service-grid" id="serviceGrid"></div>
    </section>

    <!-- ===================== 6. FUERA DEL CÓDIGO ===================== -->
    <section class="section band" id="personal">
      <header class="section-head reveal">
        <p class="kicker" data-i18n="personal.kicker"></p>
        <h2 data-i18n="personal.title"></h2>
        <p class="lead" id="personalText"></p>
      </header>

      <div class="lifestyle" id="lifestyle"></div>

      <div class="routine-head reveal">
        <h3 class="subhead" data-i18n="personal.routine"></h3>
        <p class="routine-clock">
          <span data-i18n="personal.now"></span>
          <span id="nowLocation"></span>
          <strong id="nowTime">--:--</strong>
          <span class="progress-bar" role="presentation"><span id="dayProgress"></span></span>
        </p>
      </div>
      <ol class="routine" id="routine"></ol>
    </section>

    <!-- ===================== 7. CONTACTO ===================== -->
    <section class="section contact" id="contacto">
      <div class="reveal">
        <p class="kicker" data-i18n="contact.kicker"></p>
        <h2 data-i18n="contact.title"></h2>
        <p class="lead" data-i18n="contact.lead"></p>
      </div>
      <div class="contact-actions reveal">
        <a class="btn primary" id="linkCv" data-i18n="contact.cv" download></a>
        <button class="btn ghost" id="copyEmail" type="button" data-i18n="contact.copy"></button>
      </div>
      <ul class="social reveal">
        <li><a id="linkGithub" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a id="linkLinkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a id="linkMail"></a></li>
      </ul>
    </section>

  </main>

  <footer class="site-footer">
    <span id="footerName"></span>
    <span><span data-i18n="footer.rights"></span> © <span id="year"></span></span>
    <span><span data-i18n="footer.local"></span> <span id="footerTime"></span></span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
